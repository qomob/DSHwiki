name: 每日聚合 dsh 生态

# 每天北京时间 08:00 自动聚合 → 构建部署到服务器，也支持手动触发
on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = 北京时间 08:00
  push:
    branches: [main] # 推送 main 时自动聚合 + 构建部署
    paths-ignore:
      - 'src/data/repos.json'
      - 'plugin/data/registry.json' # 本工作流自身的快照提交，避免递归触发
      - 'plugin/client.js'          # 同上：重建产物提交也由本工作流产生
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制部署（即使数据无变化也推送 dist 到服务器）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 诊断配置与配额
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "GH_TOKEN: $([ -n "$GH_TOKEN" ] && echo YES || echo NO) 前缀 ${GH_TOKEN:0:4}"
          echo "LLM_KEY: $([ -n "$LLM_API_KEY" ] && echo YES || echo NO) BASE:${LLM_API_BASE:-def} MODEL:${LLM_MODEL:-def}"
          echo "--- 配额(带token) ---"
          curl -s -m10 -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/rate_limit | head -c 300
          echo ""

      - name: 运行聚合脚本
        continue-on-error: true
        id: aggregate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: npm run aggregate

      - name: 聚合失败时用现有数据继续
        if: steps.aggregate.outcome == 'failure'
        run: |
          echo "⚠️ 聚合脚本失败（可能是 GitHub API 限流），使用现有 repos.json 继续构建部署"
          echo "当前 repos.json 仓库数: $(node -e "console.log(require("./src/data/repos.json").repos.length)")"

      - name: 同步插件内嵌快照 + 信任审计（原子：审计失败不提交无字段中间态）
        id: plugin_data
        continue-on-error: true
        run: |
          set -e
          # 1) 先审计到临时文件（不动仓库内的 registry.json）
          # 2) sync 生成新快照（粘性保留已有审计字段）
          # 3) 用审计结果覆盖（tier/version/publishedAt/repoSizeKb 全量）
          # 若 audit 失败，本步骤整体退出，git_diff 不会看到半成品。
          GH_TOKEN="${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}" node plugin/scripts/audit-registry.mjs
          node plugin/scripts/sync-registry.mjs
          # 重建 Web UI「插件」tab 的内嵌快照副本（client.js 产物随源提交）
          npx pnpm install --dir plugin --store-dir .tmp-pnpm-store
          npm run build-client --prefix plugin
          # 渲染门禁：SSR 渲染 + primitives 符号存在性审计（防 undefined 组件迟发崩溃）
          node --import ./plugin/scripts/render-hooks.mjs plugin/scripts/render-check.mjs
          rm -rf .tmp-pnpm-store

      - name: 检测数据变化
        id: git_diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/repos.json plugin/data/registry.json plugin/client.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据无变化"
          else
            git add src/data/repos.json plugin/data/registry.json plugin/client.js
            git commit -m "chore(data): 每日聚合 dsh 生态 $(date -u +%Y-%m-%d)"
            git push || echo "push 失败（可能是 token 权限不足，不影响后续构建部署）"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已更新"
          fi

      - name: 构建前端
        run: npm run build

      - name: 部署到服务器
        # 无条件部署：纯代码提交也必须上线，不能依赖当天聚合恰好产生数据变更
        uses: burnett01/rsync-deployments@796cf0d5e4b535745ce49d7429f77cf39e25ef39
        with:
          switches: -avz --delete --exclude=.user.ini
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 上传构建产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7