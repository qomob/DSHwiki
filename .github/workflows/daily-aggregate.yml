name: 每日聚合 dsh 生态

# 每天北京时间 08:00 自动聚合 → 构建部署到服务器，也支持手动触发
on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制部署（即使数据无变化也推送 dist 到服务器）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行聚合脚本
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run aggregate

      - name: 检测数据变化
        id: git_diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/repos.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据无变化"
          else
            git add src/data/repos.json
            git commit -m "chore(data): 每日聚合 dsh 生态 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已更新并提交"
          fi

      - name: 构建前端
        run: npm run build

      # ===== 自动部署到服务器 =====
      # 条件：数据有变化 或 手动勾选强制部署
      - name: 部署到服务器
        if: steps.git_diff.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 上传构建产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7