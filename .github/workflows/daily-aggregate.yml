name: 每日聚合 dsh 生态

# 每天北京时间 08:00 自动聚合 → 构建部署到服务器，也支持手动触发
on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制部署（即使数据无变化也推送 dist 到服务器）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行聚合脚本
        continue-on-error: true
        id: aggregate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run aggregate

      - name: 聚合失败时用现有数据继续
        if: steps.aggregate.outcome == 'failure'
        run: |
          echo "⚠️ 聚合脚本失败（可能是 GitHub API 限流），使用现有 repos.json 继续构建部署"
          echo "当前 repos.json 仓库数: $(node -e "console.log(require("./src/data/repos.json").repos.length)")"

      - name: 检测数据变化
        id: git_diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/repos.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据无变化"
          else
            git add src/data/repos.json
            git commit -m "chore(data): 每日聚合 dsh 生态 $(date -u +%Y-%m-%d)"
            git push || echo "push 失败（可能是 token 权限不足，不影响后续构建部署）"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已更新"
          fi

      - name: 构建前端
        run: npm run build

      # ===== 自动部署到服务器 =====
      - name: 部署到服务器
        if: steps.git_diff.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        # 锁定到精确 SHA，防止 action 作者更新 tag 后注入恶意代码
        uses: burnett01/rsync-deployments@796cf0d5e4b535745ce49d7429f77cf39e25ef39
        with:
          switches: -avz --delete --exclude=.user.ini
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 上传构建产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7